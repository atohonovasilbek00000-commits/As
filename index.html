<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telescope Social Network</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d; color: #ffffff; margin: 0; padding: 0; padding-bottom: 80px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #121212; position: sticky; top: 0; z-index: 100; }
        h1 { font-size: 22px; margin: 0; font-weight: bold; background: linear-gradient(45deg, #f09433, #e1306c, #833ab4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Tab Tizimi (Instagram / TikTok / OK) */
        .tabs { display: flex; background: #1a1a1a; padding: 4px; border-bottom: 1px solid #262626; }
        .tab-btn { flex: 1; background: none; border: none; color: #8e8e93; padding: 12px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .tab-btn.active { color: #ffffff; border-bottom: 2px solid #2481cc; }
        .feed-section { display: none; padding: 16px; }
        .feed-section.active { display: block; }

        /* 1. INSTAGRAM LENTA */
        .insta-post { background: #121212; border-radius: 12px; margin-bottom: 20px; overflow: hidden; border: 1px solid #262626; }
        .post-header { display: flex; align-items: center; padding: 12px; gap: 10px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #333; object-fit: cover; }
        .post-user { font-weight: 600; font-size: 14px; }
        .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .post-actions { padding: 12px; display: flex; gap: 16px; font-size: 20px; }
        .post-likes { padding: 0 12px 12px 12px; font-size: 13px; font-weight: bold; }

        /* 2. TIKTOK REELS (To'liq ekranli video) */
        .tiktok-container { height: calc(100vh - 120px); overflow-y: scroll; snap-type: y mandatory; }
        .tiktok-video-box { height: 100%; width: 100%; snap-align: start; position: relative; background: #000; }
        .tiktok-video { width: 100%; height: 100%; object-fit: cover; }
        .tiktok-sidebar { position: absolute; right: 16px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .side-icon { background: rgba(0,0,0,0.5); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }

        /* 3. ODNOKLASSNIKI (Mehmonlar va Guruhlar) */
        .ok-card { background: #1a1a1a; padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #e67e22; }
        .ok-title { color: #e67e22; font-weight: bold; margin-top: 0; }
        .user-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262626; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #121212; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #262626; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #8e8e93; text-decoration: none; font-size: 11px; gap: 4px; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <!-- Sarlavha va Profil rasmi -->
    <div class="header">
        <h1>Telescope Social</h1>
        <img src="https://unsplash.com" class="avatar" onclick="switchSection('ok-section')">
    </div>

    <!-- Instagram / TikTok / OK Navigatsiya Tablari -->
    <div class="tabs">
        <button class="tab-btn active" id="btn-insta" onclick="switchTab('insta-section')">📸 Instagram</button>
        <button class="tab-btn" id="btn-tiktok" onclick="switchTab('tiktok-section')">🎵 TikTok</button>
        <button class="tab-btn" id="btn-ok" onclick="switchTab('ok-section')">🧡 OK.ru</button>
    </div>

    <!-- 1. INSTAGRAM BULIMI -->
    <div id="insta-section" class="feed-section active">
        <!-- Post 1 -->
        <div class="insta-post">
            <div class="post-header">
                <img src="https://unsplash.com" class="avatar">
                <span class="post-user">brandi_andrews</span>
            </div>
            <img src="https://unsplash.com" class="post-img">
            <div class="post-actions">
                <span onclick="likePost(1)">❤️</span> <span>💬</span> <span>🚀</span>
            </div>
            <div class="post-likes"><span id="likes-1">1,240</span> likes</div>
        </div>
    </div>

    <!-- 2. TIKTOK BULIMI -->
    <div id="tiktok-section" class="feed-section">
        <div class="tiktok-container">
            <div class="tiktok-video-box">
                <video class="tiktok-video" src="https://mixkit.co" loop autoplay muted playsinline></video>
                <div class="tiktok-sidebar">
                    <div class="side-icon" onclick="alert('Liked!')">❤️</div>
                    <div class="side-icon" onclick="alert('Comment!')">💬</div>
                    <div class="side-icon" onclick="alert('Shared!')">🔗</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. ODNOKLASSNIKI BULIMI -->
    <div id="ok-section" class="feed-section">
        <!-- Mehmonlar Tizimi -->
        <div class="ok-card">
            <p class="ok-title">👥 Mening mehmonlarim (Gosti)</p>
            <div class="user-row">
                <div style="display:flex; align-items:center; gap:10px;">
                    <img src="https://unsplash.com" class="avatar">
                    <span>Alex Mucci (Bugun 18:40)</span>
                </div>
                <span style="color:#e67e22;">5+</span>
            </div>
        </div>

        <!-- Guruhlar va Sinfdoshlar -->
        <div class="ok-card">
            <p class="ok-title">🎒 Sinfdoshlar (Odnoklassniki)</p>
            <div class="user-row"><span>Toshkent 51-maktab (2018-yil bitiruvchilari)</span> <span>➡️</span></div>
            <div class="user-row"><span>Andijon Davlat Universiteti</span> <span>➡️</span></div>
        </div>
    </div>

    <!-- Pastki Navigatsiya -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active"><span>🏠</span><span>Lenta</span></a>
        <a href="#" onclick="openCreatePost()" class="nav-item"><span>➕</span><span>Yaratish</span></a>
        <a href="#" class="nav-item"><span>👤</span><span>Profil</span></a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://your-backend-server.com";

        // Tablarni almashtirish (Instagram / TikTok / OK)
        function switchTab(sectionId) {
            document.querySelectorAll('.feed-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        // Instagram Postga Layk Bosish
        async function likePost(postId) {
            const likeSpan = document.getElementById(`likes-${postId}`);
            likeSpan.innerText = (parseInt(likeSpan.innerText.replace(',', '')) + 1).toLocaleString();
            
            await fetch(`${BACKEND_URL}/api/social/like`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: tg.initDataUnsafe?.user?.id || 0, post_id: postId })
            });
        }

        // Yangi post/video yuklash oynasi
        function openCreatePost() {
            tg.showPopup({
                title: 'Yangi Kontent',
                message: 'Nima yuklamoqchisiz?',
                buttons: [{id: 'post', text: '📸 Instagram Post'}, {id: 'reels', text: '🎵 TikTok Reels'}]
            }, function(btnId) {
                if(btnId) alert(btnId + " yuklash tizimi ochildi.");
            });
        }
    </script>
</body>
</html>
