<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Telescope - Skaner va Tanishing</title>
    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d; color: #ffffff; margin: 0; padding: 16px; padding-bottom: 100px;
        }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .header-title { font-size: 24px; font-weight: 700; margin: 0; }
        
        /* Ro'yxatdan o'tish va Pasport yuklash */
        .reg-card { background-color: #1c1c1e; padding: 16px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #2c2c2e; }
        .reg-card h3 { margin-top: 0; color: #2481cc; font-size: 16px; }
        .upload-btn {
            display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #2481cc, #0056b3);
            color: white; text-align: center; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 16px;
        }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
        .input-group input {
            width: 100%; padding: 12px; background-color: #0d0d0d; border: 1px solid #3a3a3c;
            border-radius: 8px; color: white; box-sizing: border-box; font-size: 14px;
        }

        /* Filtrlar / Teglar paneli */
        .filters-container { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
        .filters-container::-webkit-scrollbar { display: none; }
        .search-btn { background-color: #1c1c1e; border: none; width: 36px; height: 36px; border-radius: 50%; color: #ffffff; display:flex; align-items:center; justify-content:center;}
        .filter-tag {
            background-color: #1c1c1e; color: #ffffff; border: none; padding: 8px 14px;
            border-radius: 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .filter-tag.active { background-color: #ffffff; color: #000000; }

        /* Grid va Model Kartochkalari */
        .grid-wrapper { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .model-card { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 3 / 4; background-color: #1c1c1e; }
        .model-card img { width: 100%; height: 100%; object-fit: cover; }
        .model-details { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); padding: 14px; }
        .model-name { font-size: 14px; font-weight: 600; margin: 0; }

        /* Pastki Menyu */
        .nav-bar-bottom {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background-color: rgba(28, 28, 30, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; width: calc(100% - 32px); max-width: 400px; padding: 10px 0; border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.05); z-index: 999;
        }
        .nav-button { display: flex; flex-direction: column; align-items: center; color: #8e8e93; text-decoration: none; font-size: 11px; gap: 4px; flex: 1; cursor: pointer; }
        .nav-button.active { color: #ffffff; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1 class="header-title">Kashf qilish</h1>
        <div>📊</div>
    </div>

    <!-- 1. Pasport orqali o'zbekcha ro'yxatdan o'tish bo'limi -->
    <div class="reg-card">
        <h3>🔒 Xavfsiz ID Ro'yxatdan o'tish</h3>
        <label class="upload-btn">
            📷 Pasportni rasmga olish
            <input type="file" id="passport-file" accept="image/*" style="display: none;" onchange="scanPassport()">
        </label>
        
        <div class="input-group">
            <label>Ism Familiya (Avtomat)</label>
            <input type="text" id="inp-name" readonly placeholder="Pasport kutilmoqda...">
        </div>
        <div class="input-group">
            <label>Tug'ilgan sana (Avtomat)</label>
            <input type="text" id="inp-dob" readonly placeholder="Pasport kutilmoqda...">
        </div>
        <div class="input-group">
            <label>Pasport Seriya raqami (Avtomat)</label>
            <input type="text" id="inp-passport" readonly placeholder="Pasport kutilmoqda...">
        </div>
        <div class="input-group">
            <label>Jinsi (Avtomat)</label>
            <input type="text" id="inp-gender" readonly placeholder="Pasport kutilmoqda...">
        </div>
    </div>

    <!-- 2. Filtrlar -->
    <div class="filters-container">
        <button class="search-btn">🔍</button>
        <button class="filter-tag active">🔥 Trenddagilar</button>
        <button class="filter-tag">💎 Mashhurlar</button>
        <button class="filter-tag">💫 Yangilar</button>
    </div>

    <!-- 3. Modellar panjarasi -->
    <div class="grid-wrapper">
        <div class="model-card">
            <img src="https://unsplash.com">
            <div class="model-details"><p class="model-name">Brandi Andrews</p></div>
        </div>
        <div class="model-card">
            <img src="https://unsplash.com">
            <div class="model-details"><p class="model-name">Chimocurves</p></div>
        </div>
    </div>

    <!-- Pastki Navigatsiya -->
    <div class="nav-bar-bottom">
        <div class="nav-button active"><span>🏠</span><span>Asosiy</span></div>
        <div class="nav-button"><span>▶️</span><span>Reels</span></div>
        <div class="nav-button"><span>👤</span><span>Profil</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // O'zingizning server ssilkangizni qo'ying
        const BACKEND_URL = "https://your-backend-server.com"; 

        async function scanPassport() {
            const fileInput = document.getElementById('passport-file');
            if (!fileInput.files.length) return;

            tg.MainButton.setText("Pasport tahlil qilinmoqda... ⏳").show();

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch(`${BACKEND_URL}/api/v1/passport-ocr`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('inp-name').value = data.full_name;
                    document.getElementById('inp-dob').value = data.birth_date;
                    document.getElementById('inp-passport').value = data.passport_number;
                    document.getElementById('inp-gender').value = data.gender;
                    
                    tg.MainButton.setText("Muvaffaqiyatli ro'yxatdan o'tdingiz! ✅");
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    alert("Pasportni o'qib bo'lmadi, iltimos aniqroq rasmga oling.");
                    tg.MainButton.hide();
                }
            } catch (error) {
                alert("Serverga ulanishda xatolik.");
                tg.MainButton.hide();
            }
        }
    </script>
</body>
</html>
